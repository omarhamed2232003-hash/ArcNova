name: Build and publish release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: gradle testDebugUnitTest

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Prepare release files and checksums
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/debug -maxdepth 1 -name '*.apk' -print -quit)"
          test -n "$APK"
          mkdir -p release
          cp "$APK" release/ArcNova-debug.apk
          (cd release && sha256sum ArcNova-debug.apk > SHA256SUMS.txt)
          git archive --format=zip --prefix="ArcNova-${GITHUB_REF_NAME}/" "$GITHUB_SHA" -o "release/ArcNova-${GITHUB_REF_NAME}-source.zip"
          git archive --format=tar.gz --prefix="ArcNova-${GITHUB_REF_NAME}/" "$GITHUB_SHA" -o "release/ArcNova-${GITHUB_REF_NAME}-source.tar.gz"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          PRERELEASE=false
          if [[ "$TAG" == *-alpha* || "$TAG" == *-beta* || "$TAG" == *-rc* ]]; then
            PRERELEASE=true
          fi
          if [[ "$PRERELEASE" == true ]]; then
            gh release create "$TAG" release/ArcNova-debug.apk release/SHA256SUMS.txt "release/ArcNova-$TAG-source.zip" "release/ArcNova-$TAG-source.tar.gz" --title "ArcNova $TAG" --generate-notes --prerelease
          else
            gh release create "$TAG" release/ArcNova-debug.apk release/SHA256SUMS.txt "release/ArcNova-$TAG-source.zip" "release/ArcNova-$TAG-source.tar.gz" --title "ArcNova $TAG" --generate-notes
          fi
