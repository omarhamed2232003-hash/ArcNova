name: Android build
on:
  push:
    branches: [ main, feature/phase1-zip-transactional-rollback ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Run unit tests
        run: gradle testDebugUnitTest

  preview-apk:
    # Only the one explicitly marked commit builds the personal preview APK.
    if: github.event_name == 'push' && github.ref == 'refs/heads/feature/phase1-zip-transactional-rollback' && contains(github.event.head_commit.message, '[build-preview]')
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Assemble preview debug APK
        run: gradle assembleDebug
      - name: Upload personal preview APK
        uses: actions/upload-artifact@v4
        with:
          name: ArcNova-Preview-0.1.0
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
